<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SynergyClimate — ข่าวสาร งานวิจัย และกิจกรรม</title>
  <meta name="description" content="ศูนย์รวมข่าวสาร โครงการวิจัย กิจกรรม และการสนับสนุนของ SynergyClimate มหาวิทยาลัยมหิดล">
  <link rel="icon" href="assets/favicon.png">

  <!-- Open Graph (ตอนแชร์ลิงก์บน Facebook/Line จะได้ภาพ+ชื่อสวยงาม) -->
  <meta property="og:title" content="SynergyClimate — ข่าวสาร งานวิจัย และกิจกรรม">
  <meta property="og:description" content="ศูนย์รวมข่าวสารและงานของ SynergyClimate มหาวิทยาลัยมหิดล">
  <!-- หมายเหตุ: og:image ควรเป็น URL เต็ม (https://...) หลังจากเว็บนี้ขึ้นจริงแล้ว
       Facebook/Line/Twitter ถึงจะดึงภาพไปแสดงตอนแชร์ลิงก์ได้ถูกต้อง
       ตอนนี้ใส่เป็น path สัมพัทธ์ไว้ก่อน ให้กลับมาแก้เป็น URL เต็มอีกที เช่น
       https://<โดเมนที่ใช้จริง>/assets/og-image.jpg -->
  <meta property="og:image" content="assets/og-image.jpg">
  <meta property="og:type" content="website">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Nunito:wght@600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>

  <!-- แถบบนสุด: อีเมล + Facebook -->
  <div class="topbar"><div class="wrap" id="topbar-slot"></div></div>

  <!-- แถบหัวเว็บ + เมนู -->
  <header class="site-header"><div class="wrap">
    <span id="brand-slot"></span>
    <nav class="nav" id="nav-slot"></nav>
    <button class="nav-toggle" id="nav-toggle" aria-label="เมนู">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
  </div></header>

  <!-- ส่วนหัว (Hero) -->
  <div class="hero" id="hero-slot"></div>

  <!-- ข่าวสาร -->
  <section class="block" id="news"><div id="news-slot"></div></section>

  <!-- พันธกิจ (5 เสาหลัก) -->
  <section class="block alt" id="mission"><div id="mission-slot"></div></section>

  <!-- ปฏิทินกิจกรรม -->
  <section class="block" id="calendar"><div id="calendar-slot"></div></section>

  <!-- สมัครรับข่าวสาร -->
  <section class="block nl-band" id="signup"><div id="newsletter-slot"></div></section>

  <!-- ภาพกิจกรรม -->
  <section class="block" id="gallery"><div id="gallery-slot"></div></section>

  <!-- งานของเรา -->
  <section class="block alt" id="projects"><div id="projects-slot"></div></section>

  <!-- งานวิจัย (พื้นหลังภาพถ่ายจริง เหมือนแถบ "งานวิจัยที่เราทำ" บนหน้าแรก Mahidol) -->
  <section class="block photo" id="research"><div id="research-slot"></div></section>

  <!-- ทีมงาน -->
  <section class="block alt" id="team"><div id="team-slot"></div></section>

  <!-- บริจาค -->
  <section class="block" id="donate"><div id="donate-slot"></div></section>

  <!-- ท้ายเว็บ -->
  <footer class="site-footer" id="footer-slot"></footer>

  <!-- เพลงประกอบเว็บ (พยายามเล่นทันทีที่เข้าเว็บ ปุ่มมุมขวาล่างไว้ปิด/เปิดเอง) -->
  <audio id="bgm-audio" src="assets/synergyclimate-bgm.mp3" loop preload="auto"></audio>
  <button id="bgm-toggle" class="bgm-toggle" type="button" aria-pressed="false" title="เปิดเพลงประกอบเว็บ">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
    </svg>
    <span class="bgm-bars" aria-hidden="true"><i></i><i></i><i></i></span>
  </button>

  <!-- เนื้อหา (แก้ที่ไฟล์นี้) แล้วตามด้วยตัวสร้างหน้าเว็บ -->
  <script src="assets/content.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
